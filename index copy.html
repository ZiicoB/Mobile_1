<script>
  const swiper = new Swiper(".swiper", {
    slidesPerView: 5,
    slidesPerGroup: 1,
    spaceBetween: 5,
    loop: false,
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
      type: "custom",
      renderCustom: function (swiper, current, total) {
        let bullets = "";
        let maxBullets = 5;

        let group = Math.ceil(current / Math.ceil(total / maxBullets));
        for (let i = 1; i <= maxBullets; i++) {
          bullets += `<span class="swiper-pagination-bullet${i === group ? " swiper-pagination-bullet-active" : ""}"></span>`;
        }
        return bullets;
      },
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
    on: {
      init: function () {
        // força renderização e atualização já no carregamento
        this.pagination.render();
        this.pagination.update();
      },
    },
  });
</script>
